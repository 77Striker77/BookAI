<body style="margin:0;background:#555">
<div id="matrixwert">MATRIX</div>
<script>
var teile = {};
addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.typ !== "mess") return;
  teile[d.w] = d;
  var breiten = Object.keys(teile).sort(function (a, b) { return a - b; });
  document.getElementById("matrixwert").textContent = "MATRIX " + breiten.map(function (k) {
    var t = teile[k];
    return k + "=" + (t.s > t.b + 1 ? "UEBER" + t.s : "ok");
  }).join(" ");
});
</script>
